name: PostgreSQL DAO contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: contract
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: contract
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcontract"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Pmysql-contract verify
        env:
          DAO_MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/contract?allowPublicKeyRetrieval=true&useSSL=false
          DAO_MYSQL_JDBC_USER: root
          DAO_MYSQL_JDBC_PASSWORD: contract
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: contract
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Pdatabase-contract verify
        env:
          DAO_JDBC_URL: jdbc:postgresql://localhost:5432/contract
          DAO_JDBC_USER: postgres
          DAO_JDBC_PASSWORD: contract
