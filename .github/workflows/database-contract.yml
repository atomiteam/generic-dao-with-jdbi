name: PostgreSQL DAO contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: contract
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Pdatabase-contract verify
        env:
          DAO_JDBC_URL: jdbc:postgresql://localhost:5432/contract
          DAO_JDBC_USER: postgres
          DAO_JDBC_PASSWORD: contract
