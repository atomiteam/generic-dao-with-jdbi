name: Maven Central release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven-central.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven-central.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact version already committed in pom.xml (no SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build, test, and generate release attachments
        run: mvn --batch-mode --no-transfer-progress clean verify

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check requested release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          version = ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version")
          requested = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9][0-9A-Za-z._-]*", requested) or "SNAPSHOT" in requested.upper():
              raise SystemExit("Use a non-SNAPSHOT release version, for example 2.0.")
          if version != requested:
              raise SystemExit(f"Requested version {requested!r} does not match pom.xml version {version!r}. Commit the desired version first.")
          print(f"Publishing org.atomiteam:generic-dao-with-jdbi:{version}")
          PY
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
      - name: Build, test, sign, and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ vars.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mvn --batch-mode --no-transfer-progress -Pcentral-release clean deploy
