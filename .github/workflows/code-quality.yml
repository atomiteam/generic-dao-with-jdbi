name: Java code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Java formatting
        run: |
          bash scripts/format-java.sh --write
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('src').rglob('*.java')):
              print('ENGINE_FORMAT ' + json.dumps({'path':str(path),'content':path.read_text()}))
          PY
