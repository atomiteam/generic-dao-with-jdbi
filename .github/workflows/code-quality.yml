name: Java code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Java formatting
        run: |
          bash scripts/format-java.sh --write
          python3 - <<'PY'
          import json
          from pathlib import Path
          for folder in ['src/main/java', 'src/test/java']:
              for path in sorted(Path(folder).rglob('*.java')):
                  print('DAO_FORMAT_SOURCE ' + json.dumps({'path': str(path), 'content': path.read_text()}))
          PY
